<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BVC Monitor - Diario de la Bolsa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --green:#1a7a3c; --dark:#12202b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:#f3f5f7; color:#22303c; }
  header { background:var(--dark); color:#fff; padding:16px 28px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; }
  header .sub { opacity:.75; font-size:13px; }
  .nav-links { display:flex; gap:6px; margin-left:14px; }
  .nav-links a { color:#fff; text-decoration:none; padding:6px 12px; border-radius:8px; font-size:14px; opacity:.8; }
  .nav-links a:hover { background:rgba(255,255,255,.12); opacity:1; }
  .nav-links a.active { background:rgba(255,255,255,.18); opacity:1; }
  .hdr-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  #btnActualizar { background:#20a05b; border:0; color:#fff; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; }
  #btnActualizar:hover { background:#178a4d; }
  #btnActualizar:disabled { opacity:.6; cursor:wait; }
  main { max-width:1200px; margin:0 auto; padding:22px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:22px; }
  .card { background:#fff; border-radius:10px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card .label { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#6b7a86; }
  .card .value { font-size:24px; font-weight:600; margin-top:4px; }
  .card .delta { font-size:13px; margin-top:2px; }
  .pos { color:var(--green); } .neg { color:#c0392b; } .flat { color:#6b7a86; }
  .panel { background:#fff; border-radius:10px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:22px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .chart-box { position:relative; height:320px; }
  @media (max-width:900px){ .charts{ grid-template-columns:1fr; } }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  input[type=date], select { padding:8px 10px; border:1px solid #cbd5dc; border-radius:8px; font-size:14px; }
  .seg { border:1px solid #cbd5dc; background:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; }
  .seg.active { background:var(--dark); color:#fff; border-color:var(--dark); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { padding:7px 10px; border-bottom:1px solid #eef2f5; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  thead th { background:#f7f9fb; text-transform:uppercase; font-size:11.5px; color:#6b7a86; }
  .table-scroll { max-height:460px; overflow:auto; }
  .muted { color:#6b7a86; }
  .tasa { font-size:13px; margin-top:2px; }
</style>
</head>
<body>
<header>
  <h1>BVC Monitor</h1>
  <div class="sub">Diario de la Bolsa de Caracas</div>
  <nav class="nav-links">
    <a href="/" class="active">Inicio</a>
    <a href="/noticias">Noticias</a>
    <a href="/portafolio">Portafolio</a>
  </nav>
  <div class="hdr-right">
    <span id="ultimaFecha" class="sub"></span>
    <button id="btnActualizar">Actualizar</button>
  </div>
</header>
<main>
  <div class="cards" id="cards"></div>

  <div class="charts">
    <div class="panel">
      <h2>Índice General
        <span style="float:right">
          <button class="seg idxseg active" data-m="bs">Bs</button>
          <button class="seg idxseg" data-m="usd">USD</button>
        </span>
      </h2>
      <div class="chart-box"><canvas id="chartIG"></canvas></div>
    </div>
    <div class="panel">
      <h2>Financiero e Industrial
        <span style="float:right">
          <button class="seg idxseg active" data-m="bs">Bs</button>
          <button class="seg idxseg" data-m="usd">USD</button>
        </span>
      </h2>
      <div class="chart-box"><canvas id="chartFI"></canvas></div>
    </div>
  </div>

  <div class="panel">
    <h2>Gráfica por ticker (Bs / USD)</h2>
    <div class="toolbar">
      <input list="simbolos" id="simbolo" placeholder="Escribir símbolo, ej. BVL" style="width:250px">
      <datalist id="simbolos"></datalist>
      <button id="btnBs" class="seg active">Bs</button>
      <button id="btnUsd" class="seg">USD</button>
      <span id="tickerInfo" class="muted"></span>
    </div>
    <div class="toolbar">
      <button class="seg rango" data-rango="ytd">YTD</button>
      <button class="seg rango" data-rango="3m">3M</button>
      <button class="seg rango" data-rango="6m">6M</button>
      <button class="seg rango" data-rango="1a">1A</button>
      <button class="seg rango" data-rango="todo">Todo</button>
      <span class="muted">Desde</span>
      <input type="date" id="rangoDesde">
      <span class="muted">Hasta</span>
      <input type="date" id="rangoHasta">
    </div>
    <div class="chart-box" style="height:380px"><canvas id="chartTicker"></canvas></div>
  </div>

  <div class="panel">
    <h2>Operaciones regulares por fecha</h2>
    <div class="toolbar">
      <input type="date" id="fecha">
      <span id="fechaInfo" class="muted"></span>
    </div>
    <div class="table-scroll">
      <table id="tabla">
        <thead><tr>
          <th>Acción</th><th>Símbolo</th><th>Anterior</th><th>Hoy</th>
          <th>Var abs.</th><th>Var rel. %</th><th>Min</th><th>Max</th>
          <th>No. ops</th><th>Cantidad</th><th>Monto Bs</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const fmt = n => n == null ? '-' : Number(n).toLocaleString('en-US', {maximumFractionDigits:2});
const pct = n => n == null ? '-' : (n>0?'+':'') + Number(n).toFixed(2) + '%';
const cls = n => n == null ? 'flat' : (n>0?'pos':(n<0?'neg':'flat'));
let chartIG=null, chartFI=null, chartTicker=null, series=[], dias=[], fechas=[];
let preciosCache=null, moneda='bs', simboloActual=null, rango='ytd', idxMoneda='bs';

function isoF(d) {
  return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}

function setRango(key) {
  rango = key;
  document.querySelectorAll('.rango').forEach(b => b.classList.toggle('active', b.dataset.rango === key));
  if (!preciosCache) return;
  const hoy = new Date();
  let d, h;
  if (key === 'ytd') { d = isoF(new Date(hoy.getFullYear(),0,1)); h = isoF(hoy); }
  else if (key === '3m') { const a = new Date(hoy); a.setMonth(a.getMonth()-3); d = isoF(a); h = isoF(hoy); }
  else if (key === '6m') { const a = new Date(hoy); a.setMonth(a.getMonth()-6); d = isoF(a); h = isoF(hoy); }
  else if (key === '1a') { const a = new Date(hoy); a.setFullYear(a.getFullYear()-1); d = isoF(a); h = isoF(hoy); }
  else if (key === 'todo') { d = preciosCache[0].fecha; h = preciosCache[preciosCache.length-1].fecha; }
  document.getElementById('rangoDesde').value = d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  document.getElementById('rangoHasta').value = h.slice(0,4)+'-'+h.slice(4,6)+'-'+h.slice(6,8);
  renderTicker();
}

function renderCards(sum) {
  const ig = sum.indices.general || {};
  const fi = sum.indices.financiero || {};
  const ii = sum.indices.industrial || {};
  const vbe = sum.alza_baja_estables || {};
  const tot = sum.totales_regulares || {};
  const cards = [
    {label:'Índice General', value:fmt(ig.valor), delta:pct(ig.var_rel), c:cls(ig.var_rel)},
    {label:'Financiero', value:fmt(fi.valor), delta:pct(fi.var_rel), c:cls(fi.var_rel)},
    {label:'Industrial', value:fmt(ii.valor), delta:pct(ii.var_rel), c:cls(ii.var_rel)},
    {label:'Tasa de cambio', value:sum.tasa_cambio || '-', delta:'', c:'flat'},
    {label:'Alza / Baja / Estables', value:(vbe.alza??'-')+' / '+(vbe.baja??'-')+' / '+(vbe.estables??'-'), delta:'', c:'flat'},
    {label:'Operaciones regulares', value:(tot.nops??'-')+' ops', delta:'Monto Bs '+fmt(tot.monto), c:'flat'},
  ];
  document.getElementById('cards').innerHTML = cards.map(c =>
    `<div class="card"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="delta ${c.c}">${c.delta}</div></div>`
  ).join('');
}

function renderCharts() {
  const labels = series.map(r => r.fecha);
  const ig = series.map(r => r.general ? (idxMoneda==='bs' ? Number(r.general) : Number(r.general_usd)) : null);
  const fi = series.map(r => r.financiero ? (idxMoneda==='bs' ? Number(r.financiero) : Number(r.financiero_usd)) : null);
  const ii = series.map(r => r.industrial ? (idxMoneda==='bs' ? Number(r.industrial) : Number(r.industrial_usd)) : null);
  if (chartIG) chartIG.destroy();
  chartIG = new Chart(document.getElementById('chartIG'), {
    type:'line',
    data:{labels, datasets:[{data:ig, borderColor:'#1a7a3c', backgroundColor:'rgba(26,122,60,.08)', fill:true, tension:.2, pointRadius:1, spanGaps:true}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>v.toLocaleString()}}, x:{ticks:{maxTicksLimit:12}}}, maintainAspectRatio:false}
  });
  if (chartFI) chartFI.destroy();
  chartFI = new Chart(document.getElementById('chartFI'), {
    type:'line',
    data:{labels, datasets:[
      {data:fi, label:'Financiero', borderColor:'#2f7ed8', tension:.2, pointRadius:1, spanGaps:true},
      {data:ii, label:'Industrial', borderColor:'#e67e22', tension:.2, pointRadius:1, spanGaps:true}
    ]},
    options:{scales:{y:{ticks:{callback:v=>v.toLocaleString()}}, x:{ticks:{maxTicksLimit:12}}}, maintainAspectRatio:false}
  });
}

function setIdxMoneda(m) {
  idxMoneda = m;
  document.querySelectorAll('.idxseg').forEach(b => b.classList.toggle('active', b.dataset.m === m));
  renderCharts();
}

function renderTable(d) {
  const rows = (d.regulares||[]).slice().sort((a,b)=>(b.var_rel??0)-(a.var_rel??0));
  document.getElementById('tabla').querySelector('tbody').innerHTML = rows.map(r => `
    <tr>
      <td>${r.nombre}</td><td>${r.simbolo}</td>
      <td>${fmt(r.anterior)}</td><td>${fmt(r.hoy)}</td>
      <td class="${cls(r.var_abs)}">${fmt(r.var_abs)}</td>
      <td class="${cls(r.var_rel)}">${pct(r.var_rel)}</td>
      <td>${fmt(r.min)}</td><td>${fmt(r.max)}</td>
      <td>${r.nops}</td><td>${fmt(r.cantidad)}</td><td>${fmt(r.monto)}</td>
    </tr>`).join('') || '<tr><td colspan="11" class="muted">Sin operaciones regulares esta fecha</td></tr>';
}

async function loadFecha(f) {
  const r = await fetch('/api/diario?fecha='+f);
  if (!r.ok) return null;
  return r.json();
}

async function loadSimbolos() {
  const r = await fetch('/api/simbolos');
  if (!r.ok) return;
  const j = await r.json();
  document.getElementById('simbolos').innerHTML =
    j.simbolos.map(s => '<option value="'+s+'"></option>').join('');
}

async function loadSerie(sim) {
  const r = await fetch('/api/precios?simbolo='+encodeURIComponent(sim));
  if (!r.ok) return null;
  return (await r.json()).serie;
}

function renderTicker() {
  if (!simboloActual || !preciosCache) return;
  const dsel = document.getElementById('rangoDesde').value.replace(/-/g,'');
  const hsel = document.getElementById('rangoHasta').value.replace(/-/g,'');
  const serie = preciosCache.filter(x => (!dsel || x.fecha >= dsel) && (!hsel || x.fecha <= hsel));
  const labels = serie.map(x => x.fecha);
  const key = moneda === 'bs' ? 'precio_bs' : 'precio_usd';
  const data = serie.map(x => x[key] != null ? Number(x[key]) : null);
  const vols = serie.map(x => x.monto != null ? Number(x.monto) : null);
  if (chartTicker) chartTicker.destroy();
  chartTicker = new Chart(document.getElementById('chartTicker'), {
    data: {labels, datasets: [
      {type:'line', data, label: moneda==='bs' ? 'Cierre Bs' : 'Cierre USD',
       borderColor:'#1a7a3c', backgroundColor:'rgba(26,122,60,.08)', fill:true,
       tension:.2, pointRadius:0, spanGaps:false, yAxisID:'y'},
      {type:'bar', data:vols, label:'Monto Bs', backgroundColor:'rgba(47,126,216,.18)', yAxisID:'y1'}
    ]},
    options: {
      maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      scales:{
        y:{position:'left', ticks:{callback:v=>v.toLocaleString()}},
        y1:{position:'right', grid:{drawOnChartArea:false}, ticks:{callback:v=>v.toLocaleString()}}
      },
      plugins:{legend:{labels:{boxWidth:12}}, tooltip:{mode:'index', intersect:false}}
    }
  });
  const ult = serie[serie.length-1];
  const ant = serie.length>1 ? serie[serie.length-2] : null;
  const v = ult ? (ult[key] != null ? Number(ult[key]) : null) : null;
  const v2 = ant && ant[key] != null ? Number(ant[key]) : null;
  const d = (v!=null && v2!=null && v2!==0) ? (v-v2)/v2*100 : null;
  const dec = moneda==='bs' ? 2 : 4;
  let info = '<b>'+simboloActual+'</b> '+(moneda==='bs'?'Bs':'US$')+' '+(v!=null?v.toLocaleString('en-US',{maximumFractionDigits:dec}):'-');
  if (d!=null) info += ' <span class="'+cls(d)+'">('+pct(d)+')</span>';
  if (ult && ult.tasa_bcv != null) info += ' · Tasa BCV '+Number(ult.tasa_bcv).toLocaleString('en-US',{maximumFractionDigits:2});
  info += ' · '+(ult ? ult.fecha : '')+' · '+serie.length+' sesiones';
  document.getElementById('tickerInfo').innerHTML = info;
}

async function selectTicker(sim) {
  sim = sim.toUpperCase();
  const serie = await loadSerie(sim);
  if (!serie) return;
  simboloActual = sim;
  preciosCache = serie;
  setRango(rango);
}

function setMoneda(m) {
  moneda = m;
  document.getElementById('btnBs').classList.toggle('active', m==='bs');
  document.getElementById('btnUsd').classList.toggle('active', m==='usd');
  renderTicker();
}

function initTicker() {
  loadSimbolos();
  document.getElementById('btnBs').addEventListener('click', () => setMoneda('bs'));
  document.getElementById('btnUsd').addEventListener('click', () => setMoneda('usd'));
  document.querySelectorAll('.rango').forEach(b =>
    b.addEventListener('click', () => setRango(b.dataset.rango))
  );
  const rd = document.getElementById('rangoDesde');
  const rh = document.getElementById('rangoHasta');
  rd.addEventListener('change', () => setRangoCustom());
  rh.addEventListener('change', () => setRangoCustom());
  const inp = document.getElementById('simbolo');
  let timer = null;
  inp.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { if (inp.value.trim()) selectTicker(inp.value.trim()); }, 350);
  });
  inp.addEventListener('change', () => { if (inp.value.trim()) selectTicker(inp.value.trim()); });
}

function setRangoCustom() {
  rango = 'custom';
  document.querySelectorAll('.rango').forEach(b => b.classList.remove('active'));
  renderTicker();
}

async function init() {
  const [inds, di] = await Promise.all([
    (await fetch('/api/indices')).json(),
    (await fetch('/api/dias')).json(),
  ]);
  series = inds.series || [];
  dias = di.dias || [];
  fechas = dias.map(d => d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8));
  const inp = document.getElementById('fecha');
  inp.max = fechas[fechas.length-1] || '';
  inp.value = fechas[fechas.length-1] || '';
  renderCharts();
  loadEstado();
  document.querySelectorAll('.idxseg').forEach(b =>
    b.addEventListener('click', () => setIdxMoneda(b.dataset.m))
  );
  const btn = document.getElementById('btnActualizar');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Actualizando...';
    try {
      const r = await fetch('/api/actualizar', {method:'POST'});
      const j = await r.json();
      if (!j.ok) alert('Error al actualizar:\n' + (j.error || j.output || 'desconocido'));
    } catch (e) { alert('Error: ' + e); }
    btn.textContent = 'Actualizar';
    btn.disabled = false;
    location.reload();
  });

  const latest = dias[dias.length-1];
  if (latest) {
    const sum = await loadFecha(latest);
    if (sum) renderCards(sum);
  }

  const sel = async () => {
    const f = inp.value.replace(/-/g,'');
    const d = await loadFecha(f);
    if (d) {
      renderTable(d);
      document.getElementById('fechaInfo').textContent =
        'Índice General: '+fmt(d.indices.general?.valor)+' ('+pct(d.indices.general?.var_rel)+')';
    }
  };
  inp.addEventListener('change', sel);
  await sel();
  initTicker();
}

async function loadEstado() {
  try {
    const r = await fetch('/api/estado');
    if (!r.ok) return;
    const j = await r.json();
    document.getElementById('ultimaFecha').textContent =
      'Última fecha: ' + (j.ultima_fecha || '-') + ' · ' + j.dias + ' días';
  } catch (e) {}
}

init();
</script>
</body>
</html>
